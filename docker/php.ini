; CEPFMS PHP settings for the Docker image.

; Citizens attach up to 5 photos of up to 5 MB each (config/cepfms.php).
upload_max_filesize = 6M
post_max_size = 32M
max_file_uploads = 10

; Image checks and PDF exports.
memory_limit = 256M

expose_php = Off
date.timezone = Asia/Manila

; The code is baked into the image, so never re-check files for changes.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
